{% extends 'base.html' %}
{% block content %}
    <h1>Support Tickets</h1>
    
    <div class="card">
        <h3>Open New Ticket</h3>
        <form method="POST">
            <input type="text" name="subject" placeholder="Subject" required>
            <textarea name="message" placeholder="Describe your issue..." required></textarea>
            <button type="submit">Submit Ticket</button>
        </form>
    </div>

    <h2>Your Tickets</h2>
    <div class="grid">
        {% for t in tickets %}
            <div class="card">
                <h4>{{ t.subject }}</h4>
                <p>{{ t.message }}</p>
                <small>{{ t.created_at.strftime('%Y-%m-%d %H:%M') }}</small>
            </div>
        {% else %}
            <p>No tickets yet.</p>
        {% endfor %}
    </div>
{% endblock %}
