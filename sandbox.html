<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cyber Arsenal | Tool Sandbox</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .sandbox-container { max-width: 800px; margin: 40px auto; background: #0a0a0a; border: 2px solid #38bdf8; padding: 30px; border-radius: 10px; box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); }
        .form-group { display: flex; gap: 10px; margin-bottom: 20px; }
        select, input { padding: 12px; background: #111; border: 1px solid #333; color: #fff; border-radius: 5px; font-family: 'Fira Code', monospace; }
        select { width: 180px; }
        input { flex: 1; }
        button { padding: 12px 25px; background: #38bdf8; color: #000; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #0ea5e9; }
        .terminal { background: #000; border: 1px solid #333; padding: 20px; border-radius: 5px; color: #00ff41; font-family: 'Fira Code', monospace; white-space: pre-wrap; min-height: 200px; max-height: 500px; overflow-y: auto; font-size: 0.9em; }
        .header-output { color: #38bdf8; margin-bottom: 10px; border-bottom: 1px dashed #333; padding-bottom: 5px; }
    </style>
</head>
<body>
    <header>
        <div class="logo" style="display: flex; align-items: center; gap: 10px;">
                    <a href="/" style="display: flex; align-items: center; text-decoration: none;">
                        <img src="/static/images/logo.svg" alt="Logo" style="width: 35px; height: 35px;">
                        <span style="color: #00ff41; font-family: 'Fira Code', monospace; font-size: 1.4em; font-weight: bold;">Cyber Arsenal</span>
                    </a>
                </div>
        <nav><a href="/" class="nav-btn">Back to Arsenal</a></nav>
    </header>
    <main>
        <div class="sandbox-container">
            <h1 style="color:#38bdf8; text-align:center;">Tool Sandbox</h1>
            <p style="text-align:center; color:#888; margin-bottom:30px;">Test basic security tools safely from your browser.</p>
            
            <div class="form-group">
                <select id="toolSelect">
                    <option value="ping">Ping</option>
                    <option value="whois">Whois</option>
                    <option value="nmap">Nmap (Fast Scan)</option>
                    <option value="curl">Curl (Headers)</option>
                    <option value="dig">Dig (DNS)</option>
                </select>
                <input type="text" id="targetInput" placeholder="Target (e.g., google.com or 8.8.8.8)">
                <button onclick="runTool()" id="runBtn">Run</button>
            </div>
            
            <div class="terminal" id="output">> Awaiting command...</div>
        </div>
    </main>
    <script>
        async function runTool() {
            const tool = document.getElementById('toolSelect').value;
            const target = document.getElementById('targetInput').value;
            const output = document.getElementById('output');
            const btn = document.getElementById('runBtn');
            
            if (!target) { alert('Please enter a target.'); return; }
            
            btn.disabled = true;
            btn.innerText = "Running...";
            output.innerHTML = `<div class="header-output">> Running ${tool.toUpperCase()} on ${target}...</div>`;
            
            try {
                const res = await fetch('/api/sandbox/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({tool, target})
                });
                const data = await res.json();
                
                if (res.ok) {
                    output.innerHTML += `<div style="color:#00ff41;">${data.output}</div>`;
                } else {
                    output.innerHTML += `<div style="color:#ff4d4d;">Error: ${data.error}</div>`;
                }
            } catch (e) {
                output.innerHTML += `<div style="color:#ff4d4d;">Connection Error: ${e.message}</div>`;
            }
            
            btn.disabled = false;
            btn.innerText = "Run";
            output.scrollTop = output.scrollHeight;
        }
    </script>
</body>
</html>
