<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cyber Arsenal | Deep Scan Bot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .bot-container { max-width: 1000px; margin: 40px auto; background: #050505; border: 2px solid #00ff41; border-radius: 10px; padding: 30px; box-shadow: 0 0 30px rgba(0, 255, 65, 0.2); }
        .bot-header { text-align: center; margin-bottom: 30px; }
        .bot-header h1 { color: #00ff41; font-family: 'Fira Code', monospace; text-transform: uppercase; letter-spacing: 2px; }
        .input-group { display: flex; gap: 15px; margin-bottom: 30px; }
        .input-group input { flex: 1; padding: 15px; background: #000; border: 1px solid #00ff41; color: #fff; font-family: 'Fira Code', monospace; border-radius: 5px; font-size: 1.1em; }
        .input-group button { padding: 15px 30px; background: #00ff41; color: #000; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; font-family: 'Fira Code', monospace; font-size: 1.1em; transition: 0.3s; }
        .input-group button:hover { background: #0ea5e9; color: #fff; box-shadow: 0 0 15px #0ea5e9; }
        
        .terminal-window { background: #000; border: 1px solid #333; border-radius: 5px; padding: 20px; max-height: 600px; overflow-y: auto; font-family: 'Fira Code', monospace; color: #00ff41; font-size: 0.9em; }
        .tool-section { margin-bottom: 25px; border: 1px solid #222; border-radius: 5px; overflow: hidden; }
        .tool-header { background: #111; padding: 10px 15px; border-bottom: 1px solid #222; }
        .tool-title { color: #38bdf8; font-weight: bold; font-size: 1.1em; display: block; margin-bottom: 5px; }
        .tool-desc { color: #888; font-size: 0.85em; font-style: italic; display: block; }
        .tool-output { padding: 15px; white-space: pre-wrap; color: #e2e8f0; }
        .loading { color: #fbbf24; font-style: italic; }
    </style>
</head>
<body>
    <header>
        <div class="logo" style="display: flex; align-items: center; gap: 10px;">
                    <a href="/" style="display: flex; align-items: center; text-decoration: none;">
                        <img src="/static/images/logo.svg" alt="Logo" style="width: 35px; height: 35px;">
                        <span style="color: #00ff41; font-family: 'Fira Code', monospace; font-size: 1.4em; font-weight: bold;">Cyber Arsenal</span>
                    </a>
                </div>
        <nav><a href="/" class="nav-btn">Back to Arsenal</a></nav>
    </header>
    <main>
        <div class="bot-container">
            <div class="bot-header">
                <h1>⚡ Deep Scan Bot ⚡</h1>
                <p style="color:#888;">Automated Reconnaissance & Vulnerability Scanner</p>
            </div>
            
            <div class="input-group">
                <input type="text" id="targetInput" placeholder="Enter Domain or IP (e.g., example.com)">
                <button onclick="startScan()" id="scanBtn">Initialize Scan</button>
            </div>
            
            <div class="terminal-window" id="terminal">
                > Bot initialized. Awaiting target...
            </div>
        </div>
    </main>
    <script>
        async function startScan() {
            const target = document.getElementById('targetInput').value.trim();
            const term = document.getElementById('terminal');
            const btn = document.getElementById('scanBtn');
            
            if(!target) { alert('Target is required.'); return; }
            
            btn.disabled = true;
            btn.innerText = "Scanning...";
            term.innerHTML = `<div style="color:#fbbf24; margin-bottom:20px;">> Initiating deep scan on <span style="color:#fff;">${target}</span>... Please wait.</div>`;
            
            try {
                const res = await fetch('/api/deepbot/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({target})
                });
                const data = await res.json();
                
                if(res.ok) {
                    data.results.forEach(result => {
                        const div = document.createElement('div');
                        div.className = 'tool-section';
                        div.innerHTML = `
                            <div class="tool-header">
                                <span class="tool-title">[+] ${result.name}</span>
                                <span class="tool-desc">${result.desc}</span>
                            </div>
                            <div class="tool-output">${result.output}</div>
                        `;
                        term.appendChild(div);
                    });
                } else {
                    term.innerHTML += `<div style="color:#ff4d4d;">[!] Error: ${data.error}</div>`;
                }
            } catch (e) {
                term.innerHTML += `<div style="color:#ff4d4d;">[!] Connection Error: ${e.message}</div>`;
            }
            
            btn.disabled = false;
            btn.innerText = "Initialize Scan";
            term.scrollTop = term.scrollHeight;
        }
    </script>
</body>
</html>
