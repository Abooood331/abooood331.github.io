<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cyber Arsenal | Tool Details</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .details-container { max-width: 800px; margin: 40px auto; background: #111; padding: 30px; border-radius: 8px; border: 1px solid #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); }
        h1 { color: #38bdf8; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .danger-badge { background: #ff4d4d; color: white; padding: 5px 10px; border-radius: 5px; font-size: 0.8em; font-weight: bold; text-transform: uppercase; margin-left: 10px; }
        .install-box { 
            background: #0a0a0a; 
            padding: 20px; 
            border-left: 4px solid #00ff41; 
            font-family: 'Fira Code', monospace; 
            white-space: pre-wrap; 
            margin-top: 20px; 
            color: #00ff41;
            border-radius: 5px;
            box-shadow: inset 0 0 10px rgba(0, 255, 65, 0.1);
        }
        .btn-github { display: inline-block; background: #333; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; margin-top: 20px; border: 1px solid #555; transition: 0.3s; }
        .btn-github:hover { background: #555; }
    </style>
</head>
<body>
    <header>
        <div class="logo" style="display: flex; align-items: center; gap: 10px;">
                    <a href="/" style="display: flex; align-items: center; text-decoration: none;">
                        <img src="/static/images/logo.svg" alt="Logo" style="width: 35px; height: 35px;">
                        <span style="color: #00ff41; font-family: 'Fira Code', monospace; font-size: 1.4em; font-weight: bold;">Cyber Arsenal</span>
                    </a>
                </div>
        <nav><a href="/" class="nav-btn">Back to Arsenal</a></nav>
    </header>
    <main>
        <div class="details-container">
            <h1 id="toolName"></h1>
            <p id="toolDesc" style="font-size: 1.1em; color: #ccc; line-height: 1.6;"></p>
            <p><strong>Category:</strong> <span id="toolCat" style="color: #fbbf24;"></span></p>
            
            <h3 style="color: #00ff41; margin-top: 30px;">Installation & Usage</h3>
            <div class="install-box" id="toolInstall"></div>
            
            <a href="#" id="toolGithub" class="btn-github" target="_blank">View on GitHub / Download</a>
        </div>
    </main>
    <script>
        const pathParts = window.location.pathname.split('/');
        const toolId = pathParts[pathParts.length - 1];
        
        fetch(`/api/tools/${toolId}`)
            .then(res => res.json())
            .then(tool => {
                document.getElementById('toolName').textContent = tool.name;
                if(tool.category === 'Dangerous') { 
                    let badge = document.createElement('span');
                    badge.className = 'danger-badge';
                    badge.textContent = 'Dangerous';
                    document.getElementById('toolName').appendChild(badge);
                }
                document.getElementById('toolDesc').innerText = tool.description || 'No description provided.';
                document.getElementById('toolCat').innerText = tool.category || 'N/A';
                document.getElementById('toolInstall').innerText = tool.installation || 'No installation guide provided.';
                document.getElementById('toolGithub').href = tool.link || '#';
            })
            .catch(err => {
                document.getElementById('toolName').innerText = "Tool not found";
            });
    </script>
</body>
</html>
