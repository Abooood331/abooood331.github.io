{% extends 'base.html' %}
{% block content %}
    <h1 style="text-align: center;">CTF Challenges</h1>
    <div class="grid">
        {% for c in challenges %}
            <div class="card">
                <h3 style="color: var(--secondary);">{{ c.title }}</h3>
                <p>{{ c.description }}</p>
                <p><strong>Points:</strong> {{ c.points }}</p>
                <form method="POST" action="/submit_challenge/{{ c.id }}">
                    <input type="text" name="flag" placeholder="flag{...}" required>
                    <button type="submit" style="width: 100%;">Submit</button>
                </form>
            </div>
        {% endfor %}
    </div>
{% endblock %}
