{% extends 'base.html' %}
{% block content %}
    <div class="card" style="border-color: var(--accent);">
        <h1 style="color: var(--accent); text-shadow: 0 0 10px var(--accent);">{{ sheet.title }}</h1>
        <p style="color: var(--text-muted); font-size: 1.1em; margin-bottom: 20px;">{{ sheet.description }}</p>
        
        <h3 style="color: var(--primary);">Commands & Steps:</h3>
        <pre style="background: #000; padding: 15px; border: 1px solid #333; border-radius: 5px; color: #00f0ff; overflow-x: auto;">
{{ sheet.content }}
        </pre>
        
        <a href="/cheatsheets" class="nav-btn" style="display: inline-block; margin-top: 20px;">← Back to Cheatsheets</a>
    </div>
{% endblock %}
