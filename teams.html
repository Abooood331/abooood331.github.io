<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cyber Arsenal | Teams</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .team-card { background: #111; border: 1px solid #38bdf8; padding: 20px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .team-info h3 { margin: 0 0 5px 0; color: #38bdf8; }
        .team-info p { margin: 0; color: #888; }
        .team-points { color: #fbbf24; font-weight: bold; font-size: 1.2em; }
        .create-team { display: flex; gap: 10px; margin-bottom: 30px; }
        .create-team input { flex: 1; padding: 10px; background: #000; border: 1px solid #333; color: #fff; border-radius: 5px; }
    </style>
</head>
<body>
    <header>
        <div class="logo"><a href="/" style="color: inherit; text-decoration: none;">Cyber Arsenal</a></div>
        <nav><a href="/" class="nav-btn">Back to Arsenal</a></nav>
    </header>
    <main style="max-width: 800px; margin: 40px auto; padding: 20px;">
        <h1 style="color:#38bdf8; text-align:center;">Teams</h1>
        <p style="text-align:center; color:#888; margin-bottom:30px;">Join a team or create your own to compete in CTFs.</p>
        
        <div class="create-team">
            <input type="text" id="newTeamName" placeholder="New Team Name...">
            <button onclick="createTeam()" class="nav-btn" style="background:#38bdf8; color:#000;">Create Team</button>
        </div>

        <div id="teamsList"></div>
    </main>
    <script>
        let myTeamId = null;

        function loadTeams() {
            fetch('/api/teams')
                .then(res => res.json())
                .then(data => {
                    myTeamId = data.my_team;
                    const list = document.getElementById('teamsList');
                    list.innerHTML = '';
                    data.teams.forEach(t => {
                        const div = document.createElement('div');
                        div.className = 'team-card';
                        let actionBtn = '';
                        if (!myTeamId) {
                            actionBtn = `<button onclick="joinTeam(${t.id})" class="nav-btn" style="padding:5px 10px; font-size:0.8em;">Join</button>`;
                        } else if (myTeamId === t.id) {
                            actionBtn = `<span style="color:#00ff41; font-weight:bold;">Your Team</span>`;
                        }
                        
                        div.innerHTML = `
                            <div class="team-info">
                                <h3>${t.name} ${myTeamId === t.id ? '(My Team)' : ''}</h3>
                                <p>Owner: ${t.owner}</p>
                            </div>
                            <div style="display:flex; align-items:center; gap:20px;">
                                <span class="team-points">${t.points} pts</span>
                                ${actionBtn}
                            </div>
                        `;
                        list.appendChild(div);
                    });
                });
        }

        function createTeam() {
            const name = document.getElementById('newTeamName').value;
            if(!name) return;
            fetch('/api/teams', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name})
            }).then(res => {
                if(res.ok) location.reload();
                else alert('Team name might be taken.');
            });
        }

        function joinTeam(id) {
            fetch('/api/teams/join', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({team_id: id})
            }).then(res => {
                if(res.ok) location.reload();
                else alert('Failed to join team.');
            });
        }

        loadTeams();
    </script>
</body>
</html>
