{% extends 'base.html' %}
{% block content %}
    <h1>Global Chat</h1>
    <div class="card" style="height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;" id="chatBox"></div>
    <div style="display: flex; gap: 10px; margin-top: 10px;">
        <input type="text" id="msgInput" placeholder="Type a message..." style="flex: 1; margin: 0;">
        <button onclick="sendMsg()">Send</button>
    </div>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();
        socket.on('receive_message', (data) => {
            const box = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.style.cssText = 'padding: 10px; border-bottom: 1px solid #333;';
            div.innerHTML = `<strong style="color: ${data.username === '{{ current_user.username }}' ? '#00ff41' : '#38bdf8'}">${data.username}:</strong> ${data.message}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        });
        function sendMsg() {
            const input = document.getElementById('msgInput');
            if(input.value.trim() === '') return;
            socket.emit('send_message', { message: input.value });
            input.value = '';
        }
    </script>
{% endblock %}
