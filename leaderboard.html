<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cyber Arsenal | Leaderboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .leaderboard-table { width: 100%; max-width: 800px; margin: auto; border-collapse: collapse; background: rgba(10, 10, 10, 0.8); border: 1px solid #00ff41; }
        .leaderboard-table th, .leaderboard-table td { padding: 15px; text-align: left; border-bottom: 1px solid #333; }
        .leaderboard-table th { background: #00ff41; color: #000; text-transform: uppercase; }
        .leaderboard-table tr:hover { background: rgba(0, 255, 65, 0.1); }
        .rank-1 { color: #fbbf24; font-weight: bold; text-shadow: 0 0 10px #fbbf24; }
        .rank-2 { color: #ccc; font-weight: bold; }
        .rank-3 { color: #cd7f32; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <div class="logo" style="display: flex; align-items: center; gap: 10px;">
                    <a href="/" style="display: flex; align-items: center; text-decoration: none;">
                        <img src="/static/images/logo.svg" alt="Logo" style="width: 35px; height: 35px;">
                        <span style="color: #00ff41; font-family: 'Fira Code', monospace; font-size: 1.4em; font-weight: bold;">Cyber Arsenal</span>
                    </a>
                </div>
        <nav>
            <a href="/" class="nav-btn">Arsenal</a>
            <a href="/missions" class="nav-btn" style="border-color:#fbbf24; color:#fbbf24;">Missions</a>
        </nav>
    </header>
    <main>
        <section class="hero">
            <h1>Global Leaderboard</h1>
            <p>Top 10 Hackers in Cyber Arsenal.</p>
        </section>
        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Hacker</th>
                    <th>Points</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody"></tbody>
        </table>
    </main>
    <script>
        fetch('/api/leaderboard')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('leaderboardBody');
                data.forEach((user, index) => {
                    const tr = document.createElement('tr');
                    let rankClass = index === 0 ? 'rank-1' : index === 1 ? 'rank-2' : index === 2 ? 'rank-3' : '';
                    tr.innerHTML = `
                        <td class="${rankClass}">#${index + 1}</td>
                        <td class="${rankClass}">${user.username}</td>
                        <td class="${rankClass}">${user.points}</td>
                    `;
                    tbody.appendChild(tr);
                });
            });
    </script>
</body>
</html>
