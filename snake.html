<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cyber Arsenal | Snake Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .game-container { display: flex; flex-direction: column; align-items: center; margin-top: 30px; }
        canvas { background-color: #0a0a0a; border: 2px solid #00ff41; box-shadow: 0 0 20px rgba(0, 255, 65, 0.3); border-radius: 10px; }
        .score-board { font-size: 24px; margin-bottom: 20px; color: #00ff41; text-shadow: 0 0 10px #00ff41; display: flex; gap: 30px; }
        .controls { margin-top: 20px; color: #888; text-align: center; }
    </style>
</head>
<body>
    <header>
        <div class="logo"><a href="/" style="color: inherit; text-decoration: none;">Cyber Arsenal</a></div>
        <nav>
            <a href="/" class="nav-btn">Arsenal</a>
            <a href="/news" class="nav-btn">News Feed</a>
        </nav>
    </header>
    <main>
        <section class="hero" style="padding-bottom: 0;">
            <h1>Hacker Snake</h1>
            <p>Eat the apples, grow the snake.</p>
        </section>

        <div class="game-container">
            <div class="score-board">
                <span>Level: <span id="level">1</span></span>
                <span>Score: <span id="score">0</span></span>
            </div>
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="controls">
                <p>Controls: ↑ ↓ ← →</p>
            </div>
        </div>
    </main>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');

        const grid = 20;
        let count = 0;
        let score = 0;
        let level = 1;
        let speed = 6; 
        let snake = { x: 160, y: 160, dx: grid, dy: 0, cells: [], maxCells: 4 };
        let apple = { x: 320, y: 320 };
        let isGameOver = false;

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min)) + min;
        }

        function loop() {
            if (isGameOver) return;
            requestAnimationFrame(loop);
            if (++count < speed) return;
            count = 0;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            snake.x += snake.dx;
            snake.y += snake.dy;

            if (snake.x < 0) snake.x = canvas.width - grid;
            else if (snake.x >= canvas.width) snake.x = 0;
            if (snake.y < 0) snake.y = canvas.height - grid;
            else if (snake.y >= canvas.height) snake.y = 0;

            snake.cells.unshift({ x: snake.x, y: snake.y });
            if (snake.cells.length > snake.maxCells) snake.cells.pop();

            // رسم التفاحة
            ctx.fillStyle = '#ff4d4d';
            ctx.beginPath();
            ctx.arc(apple.x + grid/2, apple.y + grid/2, grid/2.5, 0, 2 * Math.PI);
            ctx.fill();
            ctx.fillStyle = '#00ff41';
            ctx.fillRect(apple.x + 8, apple.y, 4, 4);

            // رسم الثعبان
            snake.cells.forEach(function(cell, index) {
                ctx.fillStyle = index === 0 ? '#00ff41' : '#008f24';
                if (index === 0) {
                    ctx.beginPath();
                    ctx.arc(cell.x + grid/2, cell.y + grid/2, grid/2, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath(); ctx.arc(cell.x + 6, cell.y + 6, 2, 0, 2 * Math.PI); ctx.fill();
                    ctx.beginPath(); ctx.arc(cell.x + 14, cell.y + 6, 2, 0, 2 * Math.PI); ctx.fill();
                } else {
                    ctx.fillRect(cell.x + 1, cell.y + 1, grid - 2, grid - 2);
                }

                // كشف الاصطدام مع التفاحة
                if (cell.x === apple.x && cell.y === apple.y) {
                    snake.maxCells++;
                    score += 10; // كل تفاحة = 10 نقاط
                    scoreElement.innerText = score;
                    
                    // نظام المستويات: كل 50 نقطة كتزيد ليفيل
                    if (score > 0 && score % 50 === 0) {
                        level++;
                        levelElement.innerText = level;
                        if (speed > 2) speed -= 1; // اللعبة كتسرع
                    } else if (speed > 2) {
                        speed -= 0.1; // تسريع تدريجي
                    }

                    apple.x = getRandomInt(0, 20) * grid;
                    apple.y = getRandomInt(0, 20) * grid;
                }

                // كشف الاصطدام مع النفس
                for (let i = index + 1; i < snake.cells.length; i++) {
                    if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
                        isGameOver = true;
                        setTimeout(() => {
                            alert("Game Over! Your Score: " + score + " | Level: " + level);
                            location.reload();
                        }, 50);
                        return;
                    }
                }
            });
        }

        document.addEventListener('keydown', function(e) {
            if (isGameOver) return;
            if (e.which === 37 && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
            else if (e.which === 38 && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; }
            else if (e.which === 39 && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
            else if (e.which === 40 && snake.dy === 0) { snake.dy = grid; snake.dx = 0; }
        });

        requestAnimationFrame(loop);
    </script>
</body>
</html>
