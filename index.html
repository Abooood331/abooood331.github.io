<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Arsenal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="logo" style="display:flex; align-items:center; gap:10px;"><img src="/static/images/logo.svg" style="width:35px;height:35px;"><span>Cyber Arsenal</span></div>
        <a href="/news" class="nav-btn">News Feed</a>
        <a href="/challenges" class="nav-btn" style="border-color: #38bdf8; color: #38bdf8;">CTF Challenges</a>
        <a href="/global_chat" class="nav-btn" style="border-color: #ff4d4d; color: #ff4d4d;">Global Chat</a>
        <a href="/tickets" class="nav-btn" style="border-color: #00ff41; color: #00ff41;">Support Tickets</a>
        <a href="/deepbot" class="nav-btn" style="border-color: #ff4d4d; color: #ff4d4d; box-shadow: 0 0 10px #ff4d4d;">Deep Scan Bot</a>
        <a href="/sandbox" class="nav-btn" style="border-color: #38bdf8; color: #38bdf8;">Tool Sandbox</a>
        <a href="/chat" class="nav-btn" style="border-color: #fbbf24; color: #fbbf24;">AI Assistant</a>
        <a href="/missions" class="nav-btn" style="border-color: #fbbf24; color: #fbbf24;">Missions</a>
        <a href="/leaderboard" class="nav-btn" style="border-color: #ff4d4d; color: #ff4d4d;">Leaderboard</a>
        <a href="/teams" class="nav-btn" style="border-color: #38bdf8; color: #38bdf8;">Teams</a>
        <a href="/snake" class="nav-btn" style="border-color: #fbbf24; color: #fbbf24;">Play Snake</a>
        
        <a href="https://youtube.com/@abdoedit02?si=LWcaMfq3qYovsLKK" target="_blank" class="nav-btn" style="border-color: #ff0000; color: #ff0000;">YouTube</a>
        <nav id="authNav"><button id="authBtn">Login/Register</button></nav>
    </header>
    <main>
        <section class="hero">
            <h1>Cyber Arsenal</h1>
            <p>Your central repository for cybersecurity tools and scripts.</p>
            <button id="addToolBtn">Add New Tool</button>
        </section>
        
        <input type="text" id="searchBar" placeholder="Search tools...">

        <div class="filter-tabs">
            <button class="tab-btn active" onclick="switchTab('all')">All Tools</button>
            <button class="tab-btn" onclick="switchTab('favorites')">My Favorites</button>
        </div>
        
        <section id="toolsGrid" class="tools-grid"></section>
    </main>

    <div id="authModal" class="modal hidden">
        <div class="modal-content">
            <span class="close" onclick="closeModal('authModal')">&times;</span>
            <div class="tabs">
                <button onclick="showTab('login')">Login</button>
                <button onclick="showTab('register')">Register</button>
            </div>
            <form id="loginForm" class="tab-content">
                <h2>Login</h2>
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <form id="registerForm" class="tab-content hidden">
                <h2>Register</h2>
                <input type="text" name="username" placeholder="Username" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Register</button>
            </form>
        </div>
    </div>

    <div id="toolModal" class="modal hidden">
        <div class="modal-content">
            <span class="close" onclick="closeModal('toolModal')">&times;</span>
            <h2 id="toolModalTitle">Add New Tool</h2>
            <form id="toolForm" enctype="multipart/form-data">
                <input type="hidden" id="toolId" name="id">
                <input type="text" name="name" placeholder="Tool Name" required>
                <textarea name="description" placeholder="Description"></textarea>
                <input type="text" name="category" placeholder="Category">
                <input type="url" name="link" placeholder="Link (e.g., GitHub)">
                <textarea name="installation" placeholder="Installation steps (e.g., apt install nmap)"></textarea>
                <label>Upload Script (Optional):</label>
                <input type="file" name="file">
                <button type="submit">Submit</button>
            </form>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
        <script>
            const socket = io();
            socket.on('notification', function(data) {
                const toast = document.createElement('div');
                toast.style.cssText = 'position:fixed; top:20px; right:20px; background:#0a0a0a; border:2px solid #00ff41; color:#00ff41; padding:15px; border-radius:5px; z-index:9999; font-family:monospace; box-shadow:0 0 10px #00ff41;';
                toast.innerText = data.message;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 5000);
            });
        </script>
        </body>
</html>
