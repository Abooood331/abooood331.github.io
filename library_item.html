{% extends 'base.html' %}
{% block content %}
    <div class="card" style="border-color: var(--primary); max-width: 800px; margin: auto;">
        <h1 style="color: var(--primary); text-shadow: 0 0 15px var(--primary); margin-top: 0;">{{ item.title }}</h1>
        
        {% if category == 'books' %}
            <h3 style="color: var(--text-muted);">By {{ item.author }}</h3>
        {% endif %}
        
        <p style="font-size: 1.1em; line-height: 1.6; color: var(--text-main);">{{ item.desc }}</p>
        
        <div style="margin-top: 30px;">
            <a href="{{ item.link }}" target="_blank" class="nav-btn" style="background: var(--primary); color: var(--bg-color); border: none; padding: 12px 25px; font-weight: bold; text-decoration: none;">Access Resource →</a>
        </div>
        
        <div style="margin-top: 20px;">
            <a href="/library" style="color: var(--text-muted); text-decoration: none;">← Back to Library</a>
        </div>
    </div>
{% endblock %}
